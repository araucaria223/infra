[bar.default]
capsule = true
center = [ "workspaces" ]
end = [ "group:g1", "group:g2", "notifications", "group:g3" ]
margin_ends = 0
start = [ "clock", "media", "tray" ]

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "bluetooth", "network" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "battery", "brightness", "volume" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "control-center", "session" ]
    opacity = 1.0
    padding = 6.0

[brightness]
minimum_brightness = 0.0099999997764825821

[calendar]
enabled = true

    [calendar.account.personal_google]
    color = "secondary"
    name = "Calendar"
    type = "google"

[control_center]
sidebar_section = "none"
width = 600

    [control_center.calendar]
    show_events_card = false

[dock]
active_scale = 0.90000001341104507
enabled = true
icon_size = 35
launcher_position = "start"
main_axis_padding = 10
pinned = [ "Firefox", "kitty", "stremio", "KeePassXC" ]
radius = 10
reserve_space = false
show_dots = true
show_instance_count = false
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "Lock & Suspend then hibernate" ]
pre_action_fade_seconds = 20

    [idle.behavior."Lock & Suspend then hibernate"]
    action = "command"
    command = "systemctl suspend-then-hibernate"
    enabled = true
    timeout = 900.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 213.0
    box_width = 810.0
    cx = 752.0
    cy = 812.5
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 752.0
    cy = 267.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        clock_style = "digital"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 144.0
    box_width = 384.0
    cx = 1072.0
    cy = 421.5
    output = "eDP-1"
    rotation = -0.0
    type = "media_player"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        hide_when_no_media = true
        layout = "horizontal"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 128.0
    box_width = 272.0
    cx = 384.0
    cy = 421.5
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

[nightlight]
enabled = true

[notification]
layer = "overlay"

[osd]
background_opacity = 0.96999997831881046
offset_x = 10
orientation = "vertical"
position = "center_right"
position_vertical = "center_right"

[shell]
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
polkit_agent = true

    [shell.launcher]
    compact = true

    [shell.panel]
    clipboard_placement = "attached"
    open_near_click_control_center = true

    [shell.screenshot]
    confirm_region = true

[wallpaper.default]
path = "/nix/store/1m378a1lm7g2zlpwpmlc8wy2p9c4xdva-noctalia-5.0.0/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/nix/store/1m378a1lm7g2zlpwpmlc8wy2p9c4xdva-noctalia-5.0.0/share/noctalia/assets/noctalia-wallpaper.png"

[widget.battery]
show_label = false

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.brightness]
show_label = false

[widget.control-center]
glyph = "adjustments"

[widget.volume]
show_label = false
